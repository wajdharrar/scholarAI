<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
  (click)="close()"
>
  <!-- Modal — stop click propagating to backdrop -->
  <div
    class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6"
    (click)="$event.stopPropagation()"
  >

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-semibold text-gray-800">Edit Profile</h2>
      <button
        type="button"
        (click)="close()"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- First name & Last name -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First name</label>
          <input
            type="text"
            formControlName="firstName"
            class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white transition-all"
            [class.border-red-400]="firstName?.invalid && firstName?.touched"
            [class.border-gray-200]="!firstName?.invalid || !firstName?.touched"
          />
          <div *ngIf="firstName?.invalid && firstName?.touched" class="text-xs text-red-500 mt-1">
            <span *ngIf="firstName?.errors?.['required']">Required.</span>
            <span *ngIf="firstName?.errors?.['pattern']">Letters only.</span>
            <span *ngIf="firstName?.errors?.['maxlength']">Max 50 characters.</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
          <input
            type="text"
            formControlName="lastName"
            class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white transition-all"
            [class.border-red-400]="lastName?.invalid && lastName?.touched"
            [class.border-gray-200]="!lastName?.invalid || !lastName?.touched"
          />
          <div *ngIf="lastName?.invalid && lastName?.touched" class="text-xs text-red-500 mt-1">
            <span *ngIf="lastName?.errors?.['required']">Required.</span>
            <span *ngIf="lastName?.errors?.['pattern']">Letters only.</span>
            <span *ngIf="lastName?.errors?.['maxlength']">Max 50 characters.</span>
          </div>
        </div>
      </div>

      <!-- Institution -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Institution</label>
        <input
          type="text"
          formControlName="institution"
          placeholder="e.g. MIT"
          class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white transition-all"
          [class.border-red-400]="institution?.invalid && institution?.touched"
          [class.border-gray-200]="!institution?.invalid || !institution?.touched"
        />
        <div *ngIf="institution?.invalid && institution?.touched" class="text-xs text-red-500 mt-1">
          <span *ngIf="institution?.errors?.['pattern']">Letters only.</span>
          <span *ngIf="institution?.errors?.['maxlength']">Max 50 characters.</span>
        </div>
      </div>

      <!-- Country -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
        <input
          type="text"
          formControlName="country"
          placeholder="e.g. Tunisia"
          class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white transition-all"
          [class.border-red-400]="country?.invalid && country?.touched"
          [class.border-gray-200]="!country?.invalid || !country?.touched"
        />
        <div *ngIf="country?.invalid && country?.touched" class="text-xs text-red-500 mt-1">
          <span *ngIf="country?.errors?.['pattern']">Letters only.</span>
          <span *ngIf="country?.errors?.['maxlength']">Max 20 characters.</span>
        </div>
      </div>

      <!-- Profile image -->
        <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Profile image <span class="text-gray-400 font-normal">(optional)</span>
        </label>

        <div class="flex items-center gap-4">
            <!-- Preview -->
            <div class="w-16 h-16 rounded-full overflow-hidden bg-gray-100 border border-gray-200 shrink-0">
            <img
                *ngIf="imagePreviewUrl"
                [src]="imagePreviewUrl"
                alt="Preview"
                class="w-full h-full object-cover"
            />
            <div *ngIf="!imagePreviewUrl" class="w-full h-full flex items-center justify-center text-gray-400 text-xs">
                No image
            </div>
            </div>

            <!-- File picker -->
            <label class="cursor-pointer inline-flex items-center gap-2 px-4 py-2 bg-gray-100 border border-gray-300 rounded-xl text-sm text-gray-700 hover:bg-gray-200 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586A2 2 0 0111 11h2a2 2 0 011.414.586L19 16M14 8a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            Choose image
            <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden />
            </label>

            <span *ngIf="selectedImage" class="text-xs text-green-600">{{ selectedImage.name }}</span>
        </div>
        </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="close()"
          class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="editForm.invalid || isLoading"
          class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all"
          [class.bg-cyan-500]="!editForm.invalid && !isLoading"
          [class.hover:bg-cyan-600]="!editForm.invalid && !isLoading"
          [class.text-white]="!editForm.invalid && !isLoading"
          [class.bg-gray-100]="editForm.invalid || isLoading"
          [class.text-gray-400]="editForm.invalid || isLoading"
          [class.cursor-not-allowed]="editForm.invalid || isLoading"
        >
          {{ isLoading ? 'Saving...' : 'Save changes' }}
        </button>
      </div>

    </form>
  </div>
</div>
