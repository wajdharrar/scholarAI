<div class="user-layout">
    <div
    class="bg-white fixed w-full z-20 top-0 start-0 border-b border-default flex items-center justify-between h-16 px-4 transition-transform duration-500"
    [class.translate-y-0]="isVisible"
    [class.-translate-y-full]="!isVisible"
  >
    <img
      src="/assets/Google_Scholar_logo.png"
      alt="Google Scholar logo"
      width="250"
      height="250"
      class="hover:scale-105 transition-transform duration-300"
    />
    <div class="relative flex-1 max-w-xl mx-8">
      <input
        type="search"
        name="search"
        placeholder="Search research papers, authors, topics..."
        class="w-full px-5 py-2.5 bg-gray-100 border border-gray-200 rounded-full text-sm focus:bg-white focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200 outline-none transition-all pr-12"
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
      />
      <fa-icon [icon]="faSearch" class="absolute top-4 right-4 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-cyan-600 w-4 h-4"(click)="onSearch()"></fa-icon>
    </div>
    <ul class="flex items-center justify-between gap-4">
      <li>
        <a routerLink="/user/ia" class="text-white bg-gradient-to-r from-cyan-500 to-blue-500 font-medium text-sm px-4 py-2.5 rounded-lg hover:scale-105 hover:shadow-lg transition-all duration-300 inline-block">
          Paper Assistant
        </a>
      </li>
      <li>
        <a routerLink="sign-in" class="text-white bg-gradient-to-r from-cyan-500 to-blue-500 font-medium text-sm px-4 py-2.5 rounded-lg hover:scale-105 hover:shadow-lg transition-all duration-300 inline-block">
          Logout
        </a>
      </li>
    </ul>
  </div>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
