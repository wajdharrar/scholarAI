<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm overflow-y-auto py-8"
     (click)="close()">
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 p-6"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-semibold text-gray-800">Edit Research Paper</h2>
      <button type="button" (click)="close()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Title -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
        <input type="text" formControlName="title"
               class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white transition-all"
               [class.border-red-400]="title?.invalid && title?.touched"
               [class.border-gray-200]="!title?.invalid || !title?.touched" />
        <div *ngIf="title?.invalid && title?.touched" class="text-xs text-red-500 mt-1">
          <span *ngIf="title?.errors?.['required']">Required.</span>
          <span *ngIf="title?.errors?.['minlength']">Minimum 10 characters.</span>
        </div>
      </div>

      <!-- Abstract -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Abstract *</label>
        <textarea formControlName="abstractText" rows="4"
                  class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white transition-all resize-y"
                  [class.border-red-400]="abstractText?.invalid && abstractText?.touched"
                  [class.border-gray-200]="!abstractText?.invalid || !abstractText?.touched"></textarea>
        <div *ngIf="abstractText?.invalid && abstractText?.touched" class="text-xs text-red-500 mt-1">
          <span *ngIf="abstractText?.errors?.['required']">Required.</span>
          <span *ngIf="abstractText?.errors?.['minlength']">Minimum 50 characters.</span>
        </div>
      </div>

      <!-- Category & Domain -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
          <select formControlName="category"
                  class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:bg-white">
            <option value="" disabled>Select category</option>
            <option *ngFor="let cat of categories" [value]="cat">{{ cat | titlecase }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Domain *</label>
          <select formControlName="domainName"
                  class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:bg-white">
            <option value="" disabled>Select domain</option>
            <option *ngFor="let d of domains" [value]="d">{{ d }}</option>
          </select>
        </div>
      </div>

      <!-- Publication Date -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Publication Date</label>
        <input type="date" formControlName="publicationDate"
               class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:bg-white" />
      </div>

      <!-- Keywords -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Keywords</label>
        <div class="flex gap-2">
          <input type="text" [(ngModel)]="newKeyword" [ngModelOptions]="{standalone: true}"
                 placeholder="Add a keyword"
                 class="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2"
                 (keyup.enter)="addKeyword()" />
          <button type="button" (click)="addKeyword()"
                  class="px-4 py-2 bg-cyan-500 text-white rounded-xl text-sm hover:bg-cyan-600 transition-colors">
            Add
          </button>
        </div>
        <div class="flex flex-wrap gap-2 mt-2">
          <span *ngFor="let kw of keywords"
                class="inline-flex items-center gap-1 px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-xs">
            {{ kw }}
            <button type="button" (click)="removeKeyword(kw)" class="hover:text-red-600">✕</button>
          </span>
        </div>
      </div>

      <!-- Replace PDF -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Replace PDF <span class="text-gray-400 font-normal">(optional — leave empty to keep current)</span>
        </label>
        <label class="cursor-pointer inline-flex items-center gap-2 px-4 py-2 bg-gray-100 border border-gray-300 rounded-xl text-sm text-gray-700 hover:bg-gray-200 transition-colors">
          Choose PDF
          <input type="file" accept="application/pdf" (change)="onDocumentSelected($event)" hidden />
        </label>
        <span *ngIf="selectedDocument" class="ml-3 text-sm text-green-600">{{ selectedDocument.name }}</span>
      </div>

      <!-- Replace Thumbnail -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Replace Thumbnail <span class="text-gray-400 font-normal">(optional)</span>
        </label>
        <div class="flex items-center gap-4">
          <label class="cursor-pointer inline-flex items-center gap-2 px-4 py-2 bg-gray-100 border border-gray-300 rounded-xl text-sm text-gray-700 hover:bg-gray-200 transition-colors">
            Choose Image
            <input type="file" accept="image/*" (change)="onThumbnailSelected($event)" hidden />
          </label>
          <img *ngIf="thumbnailPreviewUrl" [src]="thumbnailPreviewUrl"
               class="w-16 h-16 object-cover rounded-lg border" alt="thumbnail preview" />
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-2">
        <button type="button" (click)="close()"
                class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="editForm.invalid || isLoading"
                class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all"
                [class.bg-cyan-500]="!editForm.invalid && !isLoading"
                [class.hover:bg-cyan-600]="!editForm.invalid && !isLoading"
                [class.text-white]="!editForm.invalid && !isLoading"
                [class.bg-gray-100]="editForm.invalid || isLoading"
                [class.text-gray-400]="editForm.invalid || isLoading"
                [class.cursor-not-allowed]="editForm.invalid || isLoading">
          {{ isLoading ? 'Saving...' : 'Save changes' }}
        </button>
        <button *ngIf="paper?.status !== 'PUBLISHED'"
          type="button"
          [disabled]="isLoading"
          (click)="approvePaper()"
          class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white"
          [class.opacity-50]="isLoading"
          [class.cursor-not-allowed]="isLoading">
            <fa-icon [icon]="faCheck"></fa-icon>
            Approve
        </button>

        <!-- Reject — shown when paper is not already REJECTED -->
        <button *ngIf="paper?.status !== 'REJECTED'"
                type="button"
                [disabled]="isLoading"
                (click)="rejectPaper()"
                class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 text-white"
                [class.opacity-50]="isLoading"
                [class.cursor-not-allowed]="isLoading">
            <fa-icon [icon]="faXmark"></fa-icon>
            Reject
        </button>

      </div>

    </form>
  </div>
</div>
