<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm overflow-y-auto py-8"
     (click)="close()">
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 p-6"
       (click)="$event.stopPropagation()">

    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-semibold text-gray-800">Edit User</h2>
      <button type="button" (click)="close()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Avatar preview -->
      <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-xl">
        <div class="w-16 h-16 rounded-full overflow-hidden bg-gray-200 border border-gray-300 shrink-0">
          <img *ngIf="imagePreviewUrl" [src]="imagePreviewUrl" class="w-full h-full object-cover" alt="avatar" />
          <div *ngIf="!imagePreviewUrl"
               class="w-full h-full flex items-center justify-center text-gray-400 font-medium text-lg">
            {{ (user?.firstName?.charAt(0) || '') + (user?.lastName?.charAt(0) || '') }}
          </div>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-800">{{ user?.firstName }} {{ user?.lastName }}</p>
          <p class="text-xs text-gray-500 mb-2">{{ user?.email }}</p>
          <label class="cursor-pointer inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-xs text-gray-700 hover:bg-gray-50 transition-colors">
            Change photo
            <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden />
          </label>
        </div>
      </div>

      <!-- First & Last name -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First name *</label>
          <input type="text" formControlName="firstName"
                 class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white"
                 [class.border-red-400]="firstName?.invalid && firstName?.touched"
                 [class.border-gray-200]="!firstName?.invalid || !firstName?.touched" />
          <div *ngIf="firstName?.invalid && firstName?.touched" class="text-xs text-red-500 mt-1">
            <span *ngIf="firstName?.errors?.['required']">Required.</span>
            <span *ngIf="firstName?.errors?.['pattern']">Letters only.</span>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last name *</label>
          <input type="text" formControlName="lastName"
                 class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white"
                 [class.border-red-400]="lastName?.invalid && lastName?.touched"
                 [class.border-gray-200]="!lastName?.invalid || !lastName?.touched" />
          <div *ngIf="lastName?.invalid && lastName?.touched" class="text-xs text-red-500 mt-1">
            <span *ngIf="lastName?.errors?.['required']">Required.</span>
            <span *ngIf="lastName?.errors?.['pattern']">Letters only.</span>
          </div>
        </div>
      </div>

      <!-- Institution & Country -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Institution</label>
          <input type="text" formControlName="institution" placeholder="e.g. MIT"
                 class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white"
                 [class.border-red-400]="institution?.invalid && institution?.touched"
                 [class.border-gray-200]="!institution?.invalid || !institution?.touched" />
          <div *ngIf="institution?.invalid && institution?.touched" class="text-xs text-red-500 mt-1">
            <span *ngIf="institution?.errors?.['pattern']">Letters only.</span>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
          <input type="text" formControlName="country" placeholder="e.g. Tunisia"
                 class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:bg-white"
                 [class.border-red-400]="country?.invalid && country?.touched"
                 [class.border-gray-200]="!country?.invalid || !country?.touched" />
          <div *ngIf="country?.invalid && country?.touched" class="text-xs text-red-500 mt-1">
            <span *ngIf="country?.errors?.['pattern']">Letters only.</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-2">
        <button type="button" (click)="close()"
                class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="editForm.invalid || isLoading"
                class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all"
                [class.bg-cyan-500]="!editForm.invalid && !isLoading"
                [class.text-white]="!editForm.invalid && !isLoading"
                [class.bg-gray-100]="editForm.invalid || isLoading"
                [class.text-gray-400]="editForm.invalid || isLoading"
                [class.cursor-not-allowed]="editForm.invalid || isLoading">
          {{ isLoading ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>

    </form>
  </div>
</div>
